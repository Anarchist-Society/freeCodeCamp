<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Workshop de FreeCodeCamp" />
    <title>Accessible Controls</title>
  </head>

  <body>
    <main>
      <h1>Audio Controls</h1>

      <button type="button">Play</button>

      <div>
        <span id="volume-label">Volume</span>
        <span id="volume-description">Adjust the sound level</span>
        <input
          type="range"
          min="0"
          max="100"
          value="50"
          aria-labelledby="volume-label volume-description"
        />
      </div>

      <button type="button">Mute</button>
    </main>
  </body>
</html>
