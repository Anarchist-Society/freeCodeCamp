<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Lab de FreeCodeCamp" />
    <title>Donation Form</title>
  </head>

  <body>
    <main>
      <h1>Donation Form</h1>
      <form>
        <label for="name">Full Name:</label>
        <input id="name" type="text" name="name" required />

        <label for="email">Email Address:</label>
        <input id="email" type="email" name="email" required />

        <label for="donation">Donation Amount ($):</label>
        <input id="donation" type="number" name="amount" required />

        <label for="subscription">Subscribe</label>
        <input id="subscription" type="checkbox" name="newsletter" />

        <input type="submit" value="Send" />
      </form>
    </main>
  </body>
</html>
