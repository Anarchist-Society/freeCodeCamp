<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Lab de FreeCodeCamp" />
    <title>HTML Audio and Video Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main>
      <h1>HTML Audio and Video Lab</h1>

      <section>
        <h2>What is the map method and how does it work?</h2>
        <video controls>
          <source
            src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
            type="video/mp4"
          />
        </video>
      </section>

      <section>
        <h2>Sailing Away</h2>
        <audio
          src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3"
          controls
          loop
        ></audio>
      </section>
    </main>
  </body>
</html>
