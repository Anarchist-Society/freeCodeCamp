<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Certification project de FreeCodeCamp" />
    <link rel="stylesheet" href="style.css" />
    <title>4 de corazones</title>
  </head>

  <body>
    <main>
      <div class="card">
        <!-- Columna izquierda: esquina superior izquierda -->
        <div class="left">
          <div>4</div>
          <div>♥</div>
        </div>

        <!-- Columna central: 4 corazones en cuadrícula 2×2 -->
        <div class="middle four">
          <div>♥</div>
          <div>♥</div>
          <div class="flipped">♥</div>
          <div class="flipped">♥</div>
        </div>

        <!-- Columna derecha: esquina inferior derecha (volteada 180°) -->
        <div class="right">
          <div class="flipped">♥</div>
          <div class="flipped">4</div>
        </div>
      </div>
    </main>
  </body>
</html>
