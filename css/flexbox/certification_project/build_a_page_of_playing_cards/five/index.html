<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Certification project de FreeCodeCamp" />
    <link rel="stylesheet" href="style.css" />
    <title>5 de corazones</title>
  </head>

  <body>
    <main>
      <div class="card">
        <!-- Columna izquierda: esquina superior izquierda -->
        <div class="left">
          <div>5</div>
          <div>♥</div>
        </div>

        <!-- Columna central: 5 corazones — 2 arriba, 1 centro, 2 abajo -->
        <div class="middle five">
          <div>♥</div>
          <div>♥</div>
          <div>♥</div>
          <!-- Corazón central: ancho completo -->
          <div class="flipped">♥</div>
          <div class="flipped">♥</div>
        </div>

        <!-- Columna derecha: esquina inferior derecha (volteada) -->
        <div class="right">
          <div class="flipped">♥</div>
          <div class="flipped">5</div>
        </div>
      </div>
    </main>
  </body>
</html>
