<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Certification project de FreeCodeCamp" />
    <link rel="stylesheet" href="styles.css" />
    <title>Playing Cards</title>
  </head>

  <body>
    <main id="playing-cards">
      <div class="card">
        <div class="left">
          <div class="A">A</div>
          <div>♠</div>
        </div>

        <div class="middle">
          <div>♠</div>
        </div>

        <div class="right">
          <div class="flipped">♠</div>
          <div class="flipped">A</div>
        </div>
      </div>

      <div class="card">
        <div class="left">
          <div class="A">2</div>
          <div>♣</div>
        </div>

        <div class="middle">
          <div>♣</div>
          <div class="flipped">♣</div>
        </div>

        <div class="right">
          <div class="flipped">♣</div>
          <div class="flipped">2</div>
        </div>
      </div>

      <div class="card red">
        <div class="left">
          <div class="A">3</div>
          <div>♥</div>
        </div>

        <div class="middle">
          <div>♥</div>
          <div>♥</div>
          <div class="flipped">♥</div>
        </div>

        <div class="right">
          <div class="flipped">♥</div>
          <div class="flipped">3</div>
        </div>
      </div>

      <div class="card">
        <div class="left">
          <div class="A">4</div>
          <div>♣</div>
        </div>

        <div class="middle">
          <div class="middle-section">
            <div>♣</div>
            <div>♣</div>
          </div>

          <div class="middle-section">
            <div class="flipped">♣</div>
            <div class="flipped">♣</div>
          </div>
        </div>

        <div class="right">
          <div class="flipped">♣</div>
          <div class="flipped">4</div>
        </div>
      </div>

      <div class="card red">
        <div class="left">
          <div class="A">5</div>
          <div>♦</div>
        </div>

        <div class="middle">
          <div class="middle-section">
            <div>♦</div>
            <div>♦</div>
          </div>

          <div class="middle-section">
            <div>♦</div>
          </div>

          <div class="middle-section">
            <div class="flipped">♦</div>
            <div class="flipped">♦</div>
          </div>
        </div>

        <div class="right">
          <div class="flipped">♦</div>
          <div class="flipped">5</div>
        </div>
      </div>
    </main>
  </body>
</html>
