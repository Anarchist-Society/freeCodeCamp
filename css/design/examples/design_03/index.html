<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejemplo de FreeCodeCamp" />
    <title>Composition</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main>
      <h1>Composition &amp; Balance</h1>

      <div class="section symmetrical">
        <div class="box-container">
          <div class="box">A</div>
          <div class="box">B</div>
          <div class="box">A</div>
        </div>
        <div class="description">
          Symmetrical Balance – Equal weight on both sides.
        </div>
      </div>

      <div class="section asymmetrical">
        <div class="box-container">
          <div class="box">A</div>
          <div class="box">C</div>
          <div class="box">B</div>
        </div>
        <div class="description">
          Asymmetrical Balance – Unequal but still harmonious.
        </div>
      </div>
    </main>
  </body>
</html>
