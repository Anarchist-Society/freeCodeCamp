<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Lab de ejemplo de FreeCodeCamp" />
    <title>Styled To-Do List</title>
    <link href="styles.css" rel="stylesheet" />
  </head>

  <body>
    <main>
      <div class="container">
        <h1>My To-Do List</h1>
        <ul class="todo-list">
          <li>
            <input type="checkbox" id="task1" />
            <label for="task1">Explore gaming keyboard</label>
            <ul class="sub-item">
              <li>
                <a href="#" target="_blank" class="sub-item-link">Store link</a>
              </li>
            </ul>
          </li>

          <li>
            <input type="checkbox" id="task2" />
            <label for="task2">Finish the report</label>
            <ul class="sub-item">
              <li>
                <a href="#" target="_blank" class="sub-item-link"
                  >Request Access</a
                >
              </li>
            </ul>
          </li>

          <li>
            <input type="checkbox" id="task3" />
            <label for="task3">View Phone's Warranty</label>
            <ul class="sub-item">
              <li>
                <a href="#" target="_blank" class="sub-item-link"
                  >View Receipts</a
                >
              </li>
            </ul>
          </li>

          <li>
            <input type="checkbox" id="task4" />
            <label for="task4">Check Processor Specs</label>
            <ul class="sub-item">
              <li>
                <a href="#" target="_blank" class="sub-item-link"
                  >View Model Number</a
                >
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </main>
  </body>
</html>
