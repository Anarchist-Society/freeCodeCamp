<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Lab de FreeCodeCamp" />
    <title>Blog Post Card</title>
    <link href="styles.css" rel="stylesheet" />
  </head>

  <body>
    <main>
      <div class="blog-post-card">
        <img class="post-img" src="vim.webp" alt="Image of Vim" />

        <div class="post-content">
          <h1 class="post-title">Learning the Vim Editors</h1>
          <p class="post-excerpt">Power and Agility Beyond Just Text Editing</p>
          <a
            class="read-more"
            href="https://www.vim.org/"
            aria-label="Read more about vim"
            >Read More</a
          >
        </div>
      </div>
    </main>
  </body>
</html>
