<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Lab de ejemplo de FreeCodeCamp" />
    <title>Blog Post Card</title>
    <link href="styles.css" rel="stylesheet" />
  </head>

  <body>
    <main>
      <div class="blog-post-card">
        <img
          src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
          alt="Blog Post Image"
          class="post-image"
        />

        <div class="post-content">
          <h2>Learn Web Development in 2026</h2>
          <p class="post-excerpt">
            Stay ahead of the curve with the latest trends in web development.
            Discover what's new and exciting in 2024
          </p>
          <a href="#" class="read-more">Read More</a>
        </div>
      </div>
    </main>
  </body>
</html>
