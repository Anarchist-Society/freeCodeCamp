<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Lab de ejemplo de FreeCodeCamp" />
    <title>Business Card</title>
    <link href="styles.css" rel="stylesheet" />
  </head>

  <body>
    <main>
      <div class="business-card">
        <img
          src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg"
          alt="A vibrant flower in full bloom"
          class="profile-image"
        />

        <p class="full-name">Your name</p>
        <p class="designation">Software Developer</p>
        <p class="company">@freeCodeCamp</p>

        <hr />

        <p>Email: your-email@example.com</p>
        <p>Phone: (123) 456-7890</p>
        <a class="portfolio-link" href="http://example.com">Portfolio</a>

        <hr />

        <div class="social-media">
          <h2>Connect with me</h2>
          <a href="">Twitter</a>
          <a href="">LinkedIn</a>
          <a href="">Github</a>
        </div>
      </div>
    </main>
  </body>
</html>
