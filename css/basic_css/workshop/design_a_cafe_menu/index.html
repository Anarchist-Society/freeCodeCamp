<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Workshop de FreeCodeCamp" />
    <title>Design a Cafe Menu</title>
    <link href="styles.css" rel="stylesheet" />
  </head>

  <body>
    <div class="menu">
      <main>
        <h1>CAMPER CAFE</h1>
        <p class="established">Est. 2020</p>

        <hr />

        <section>
          <h2>Coffee</h2>

          <img
            src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg"
            alt="coffee icon"
          />

          <article class="item">
            <h3 class="flavor">French Vanilla</h3>
            <p class="price">3.00</p>
          </article>

          <article class="item">
            <h3 class="flavor">Caramel Macchiato</h3>
            <p class="price">3.75</p>
          </article>

          <article class="item">
            <h3 class="flavor">Pumpkin Spice</h3>
            <p class="price">3.50</p>
          </article>

          <article class="item">
            <h3 class="flavor">Hazelnut</h3>
            <p class="price">4.00</p>
          </article>

          <article class="item">
            <h3 class="flavor">Mocha</h3>
            <p class="price">4.50</p>
          </article>
        </section>

        <section>
          <h2>Desserts</h2>

          <img
            src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg"
            alt="pie icon"
          />

          <article class="item">
            <h3 class="dessert">Donut</h3>
            <p class="price">1.50</p>
          </article>

          <article class="item">
            <h3 class="dessert">Cherry Pie</h3>
            <p class="price">2.75</p>
          </article>

          <article class="item">
            <h3 class="dessert">Cheesecake</h3>
            <p class="price">3.00</p>
          </article>

          <article class="item">
            <h3 class="dessert">Cinnamon Roll</h3>
            <p class="price">2.50</p>
          </article>
        </section>
      </main>

      <hr class="bottom-line" />

      <footer>
        <address>
          <p>
            <a href="https://www.freecodecamp.org" target="_blank"
              >Visit our website</a
            >
          </p>
          <p class="address">123 Free Code Camp Drive</p>
        </address>
      </footer>
    </div>
  </body>
</html>
