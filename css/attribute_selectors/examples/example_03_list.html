<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejemplo de FreeCodeCamp" />
    <title>Attribute selector with List Elements</title>
    <style>
      ol[type="A"] {
        color: purple;
        font-weight: bold;
      }

      ol[type="i"] {
        color: green;
      }
    </style>
  </head>

  <body>
    <main>
      <ol type="A">
        <li>Item 1</li>
        <li>Item 2</li>
      </ol>
      <ol type="i">
        <li>Item 1</li>
        <li>Item 2</li>
      </ol>
    </main>
  </body>
</html>
