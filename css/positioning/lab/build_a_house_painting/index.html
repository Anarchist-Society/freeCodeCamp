<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Lab de FreeCodeCamp" />
    <title>House Painting</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main>
      <img id="tux-and-gnu" src="gnu_and_tux.webp" alt="tux-gnu" />

      <img id="fsociety" src="fsociety.webp" alt="fuck society" />

      <div id="house">
        <img id="beastie" src="beastie.webp" alt="beastie" />

        <div id="chimney">
          <img class="smoke" id="smoke-1" src="arch.webp" alt="arch-logo" />
          <img class="smoke" id="smoke-2" src="arch.webp" alt="arch-logo" />
          <img class="smoke" id="smoke-3" src="arch.webp" alt="arch-logo" />
          <img class="smoke" id="smoke-4" src="arch.webp" alt="arch-logo" />
          <img class="smoke" id="smoke-5" src="arch.webp" alt="arch-logo" />
          <img class="smoke" id="smoke-6" src="arch.webp" alt="arch-logo" />
          <img class="smoke" id="smoke-7" src="arch.webp" alt="arch-logo" />
        </div>

        <div id="roof"></div>

        <div id="window-1">
          <img id="tux" src="tux.webp" alt="tux" />
        </div>

        <div id="window-2">
          <img id="terry" src="terry.webp" alt="terry" />
        </div>

        <div id="door">
          <div id="door-knob"></div>
        </div>
      </div>
    </main>
  </body>
</html>
