<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejemplo de FreeCodeCamp" />
    <title>Clearfix for floats Example</title>
    <style>
      .container {
        border: 1px solid black;
      }

      .container::after {
        content: "";
        display: block;
        clear: both;
      }

      img {
        float: left;
        margin-right: 20px;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="container">
        <img src="https://placehold.co/150x150" alt="Placeholder Image" />
        <p>This is an example of text flowing around a floated image.</p>
      </div>
    </main>
  </body>
</html>
