<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Anarchist-Society" />
    <meta name="description" content="Ejemplo de FreeCodeCamp" />
    <title>Position Relative Example</title>
    <style>
      body {
        border: solid 1px black;
      }

      .relative {
        position: relative;
        top: 30px;
        left: 30px;
      }
    </style>
  </head>

  <body>
    <main>
      <p>This paragraph is statically positioned.</p>
      <p class="relative">This paragraph is positioned relatively.</p>
    </main>
  </body>
</html>
